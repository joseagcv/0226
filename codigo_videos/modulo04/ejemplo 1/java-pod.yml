apiVersion: v1
kind: Pod
metadata:
  name: java-app
  labels:
    app: java-app
  namespace: java-app

spec:
  containers:
    - name: java-container
      image: joseagcv/java-api
      ports:
        - containerPort: 8080
      env:
        - name: PYTHON_URL_PORT
          value: "python-service:7000"
  imagePullSecrets:
    - name: regcred