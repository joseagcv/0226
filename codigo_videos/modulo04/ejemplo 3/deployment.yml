# ------------------- Python Deployment -------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app
  namespace: java-app-3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
    spec:
      containers:
        - name: python-api
          image: joseagcv/python-api
          ports:
            - containerPort: 8000
          env:
            - name: DIRECTORY
              value: /app/message
---

# ------------------- Python Service -------------------
apiVersion: v1
kind: Service
metadata:
  name: python-service
  namespace: java-app-3
spec:
  selector:
    app: python-app
  ports:
    - protocol: TCP
      port: 7000
      targetPort: 8000
---

# ------------------- Java Deployment -------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app
  namespace: java-app-3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
        - name: java-container
          image: joseagcv/java-api
          ports:
            - containerPort: 8080
          env:
            - name: PYTHON_URL_PORT
              value: "python-service:7000"
      imagePullSecrets:
        - name: regcred

---
# ------------------- Java Service -------------------

apiVersion: v1
kind: Service
metadata:
  name: java-service
  namespace: java-app-3
spec:
  type: NodePort
  selector:
    app: java-app
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8080
      nodePort: 30099

