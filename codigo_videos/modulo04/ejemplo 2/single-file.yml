# ------------------- Python Pod -------------------

apiVersion: v1
kind: Pod
metadata:
  name: python-app
  namespace: java-app-2
  labels:
    app: python-app
spec:
  containers:
    - name: python-api
      image: joseagcv/python-api
      ports:
        - containerPort: 8000
      env:
        - name: DIRECTORY
          value: /app/message

---
# ------------------- Java Pod -------------------

apiVersion: v1
kind: Pod
metadata:
  name: java-app
  labels:
    app: java-app
  namespace: java-app-2

spec:
  containers:
    - name: java-container
      image: joseagcv/java-api
      ports:
        - containerPort: 8080
      env:
        - name: PYTHON_URL_PORT
          value: "python-service:7000"
  imagePullSecrets:
    - name: regcred

---

# ------------------- Java Service -------------------

apiVersion: v1
kind: Service
metadata:
  name: java-service
  namespace: java-app-2
spec:
  type: NodePort
  selector:
    app: java-app
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8080
      nodePort: 30090

---

# ------------------- Python Service -------------------

apiVersion: v1
kind: Service
metadata:
  name: python-service
  namespace: java-app-2
spec:
  selector:
    app: python-app
  ports:
    - protocol: TCP
      port: 7000
      targetPort: 8000
